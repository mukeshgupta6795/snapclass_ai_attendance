name: Python Package

on:
  push:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install test tools
        run: |
          python -m pip install flake8 pytest

      - name: Lint with flake8
  run: |
    flake8 app.py src --exclude=venv,.venv,__pycache__ --count --select=E9,F63,F7,F82 --show-source --statistics
    flake8 app.py src --exclude=venv,.venv,__pycache__ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: pytest